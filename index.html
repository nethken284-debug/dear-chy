<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0f1f">
<meta name="description" content="有一句話，想了很久才敢問你。">
<meta property="og:title" content="給 chy">
<meta property="og:description" content="有一句話，想了很久才敢問你。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23f2a7bf' d='M16 28C6 21 2 15 2 10a7 7 0 0 1 14-2 7 7 0 0 1 14 2c0 5-4 11-14 18z'/%3E%3C/svg%3E">
<title>給 chy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italianno&family=LXGW+WenKai+TC:wght@300;400;700&display=swap">
<style>
/* Layout: one dusky screen, candle-glow bokeh drifting behind a centred question; the two answers sit side by side. */
:root {
  --night: #1a0f1f;        /* deep plum dusk */
  --wine: #3a1530;
  --rose: #f2a7bf;         /* blush accent */
  --rose-deep: #d9668f;
  --glow: #ffd6c2;         /* candle warmth */
  --ink: #f7e8ee;
  --muted: #c7a6b7;
  --display: "Italianno", "Snell Roundhand", cursive;
  --body: "LXGW WenKai TC", "PingFang TC", "Noto Serif TC", serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 90% at 50% 110%, var(--wine) 0%, var(--night) 60%) fixed, var(--night);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
canvas#bokeh { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

.stage {
  position: relative;
  min-height: 100%;
  display: grid;
  place-items: center;
  padding-inline: 16px;
  box-sizing: border-box;
}
.card {
  display: grid;
  justify-items: center;
  gap: 1.4rem;
  text-align: center;
  max-width: 34rem;
  animation: rise 1.8s ease-out both;
}
.name {
  font-family: var(--display);
  font-size: clamp(5rem, 22vw, 9.5rem);
  line-height: .8;
  color: var(--rose);
  text-shadow: 0 0 28px rgba(242, 167, 191, .55), 0 0 70px rgba(217, 102, 143, .35);
  animation: breathe 4.5s ease-in-out infinite;
}
.question {
  margin: 0;
  font-size: clamp(1.35rem, 5vw, 1.9rem);
  font-weight: 400;
  letter-spacing: .12em;
  text-wrap: balance;
}
.whisper {
  margin: -.6rem 0 0;
  font-size: .95rem;
  font-weight: 300;
  color: var(--muted);
  letter-spacing: .2em;
}
.answers {
  display: flex;
  gap: clamp(1.5rem, 8vw, 4rem);
  margin-top: 1rem;
  align-items: center;
  justify-content: center;
  min-height: 4.5rem;
}
button {
  font: inherit;
  cursor: pointer;
  border-radius: 999px;
  padding: .75em 2.1em;
  font-size: 1.1rem;
  letter-spacing: .25em;
  transition: transform .35s cubic-bezier(.3,1.6,.5,1), box-shadow .3s, background .3s;
}
button:focus-visible { outline: 2px solid var(--glow); outline-offset: 4px; }
#yes {
  border: 1px solid var(--rose);
  background: linear-gradient(135deg, var(--rose-deep), var(--rose));
  color: var(--night);
  font-weight: 700;
  box-shadow: 0 0 24px rgba(242, 167, 191, .45);
  transform: scale(var(--grow, 1));
}
#yes:hover { box-shadow: 0 0 40px rgba(255, 214, 194, .7); }
#no {
  border: 1px solid rgba(199, 166, 183, .45);
  background: rgba(26, 15, 31, .4);
  color: var(--muted);
  backdrop-filter: blur(4px);
  white-space: nowrap;
}
#no.loose {
  position: fixed;
  z-index: 5;
  transition: left .28s ease-out, top .28s ease-out;
}

/* after yes */
.after {
  display: grid;
  justify-items: center;
  gap: 1rem;
  text-align: center;
  animation: rise 1.4s ease-out both;
}
.after .big {
  font-family: var(--display);
  font-size: clamp(4rem, 16vw, 7rem);
  line-height: .9;
  color: var(--glow);
  text-shadow: 0 0 30px rgba(255, 214, 194, .6);
}
.after p { margin: 0; font-size: clamp(1.2rem, 4.5vw, 1.6rem); letter-spacing: .1em; }
.after .small { font-size: 1rem; color: var(--muted); letter-spacing: .2em; }
#again {
  margin-top: 1.2rem;
  font-size: .95rem;
  padding: .6em 1.8em;
  border: 1px solid rgba(199, 166, 183, .45);
  background: rgba(26, 15, 31, .4);
  color: var(--muted);
}
#again:hover { color: var(--ink); border-color: var(--rose); }
.after { cursor: pointer; }

@keyframes rise { from { opacity: .0; transform: translateY(18px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes breathe { 50% { text-shadow: 0 0 40px rgba(242,167,191,.8), 0 0 100px rgba(217,102,143,.5); } }
@media (prefers-reduced-motion: reduce) {
  .card, .after, .name { animation: none; }
  #no.loose { transition: none; }
}

/* music toggle */
#music {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  right: 16px;
  z-index: 10;
  font-size: .85rem;
  letter-spacing: .15em;
  padding: .5em 1.2em;
  border: 1px solid rgba(199, 166, 183, .4);
  background: rgba(26, 15, 31, .5);
  color: var(--muted);
  backdrop-filter: blur(6px);
}
#music:hover { color: var(--ink); border-color: var(--rose); }
#music.off { animation: beckon 2.6s ease-in-out infinite; }
#music .note { display: inline-block; margin-right: .4em; color: var(--rose); }
#music.on .note { animation: sway 1.7s ease-in-out infinite; }
@keyframes beckon { 50% { box-shadow: 0 0 18px rgba(242, 167, 191, .45); border-color: var(--rose); } }
@keyframes sway { 50% { transform: translateY(-3px) rotate(-8deg); } }
@media (prefers-reduced-motion: reduce) { #music.off, #music.on .note { animation: none; } }
</style>
</head>
<body>

<canvas id="bokeh" aria-hidden="true"></canvas>
<button id="music" class="off" type="button" aria-pressed="false"><span class="note">♪</span><span class="label">開啟音樂</span></button>

<main class="stage">
  <section class="card" id="ask">
    <div class="name">chy</div>
    <h1 class="question">你接受我的表白嗎？</h1>
    <p class="whisper">想了很久，還是想讓你知道</p>
    <div class="answers">
      <button id="yes" type="button">同意</button>
      <button id="no" type="button">不同意</button>
    </div>
  </section>

  <section class="after" id="after" hidden>
    <div class="big">chy</div>
    <p>我就知道，你也是。</p>
    <p class="small">從今天起，請多指教</p>
    <button id="again" type="button">再來一次</button>
  </section>
</main>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- background: drifting candle-light bokeh + hearts on yes ---------- */
  const cv = document.getElementById('bokeh');
  const ctx = cv.getContext('2d');
  let W, H, dpr;
  const hues = ['242,167,191', '217,102,143', '255,214,194', '190,120,200'];
  const dots = [];
  const hearts = [];
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function spawnDot(initial) {
    return {
      x: Math.random() * W,
      y: initial ? Math.random() * H : H + 40,
      r: 6 + Math.random() * 38,
      a: .05 + Math.random() * .18,
      vy: .1 + Math.random() * .35,
      sway: Math.random() * Math.PI * 2,
      c: hues[Math.random() * hues.length | 0]
    };
  }
  resize();
  addEventListener('resize', resize);
  for (let i = 0; i < 46; i++) dots.push(spawnDot(true));

  function heartPath(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * .3);
    ctx.bezierCurveTo(x, y, x - s * .5, y, x - s * .5, y + s * .3);
    ctx.bezierCurveTo(x - s * .5, y + s * .6, x, y + s * .8, x, y + s);
    ctx.bezierCurveTo(x, y + s * .8, x + s * .5, y + s * .6, x + s * .5, y + s * .3);
    ctx.bezierCurveTo(x + s * .5, y, x, y, x, y + s * .3);
    ctx.fill();
  }

  function frame(t) {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (const d of dots) {
      d.y -= d.vy; d.sway += .006;
      const x = d.x + Math.sin(d.sway) * 18;
      const g = ctx.createRadialGradient(x, d.y, 0, x, d.y, d.r);
      g.addColorStop(0, `rgba(${d.c},${d.a})`);
      g.addColorStop(1, `rgba(${d.c},0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
      if (d.y < -50) Object.assign(d, spawnDot(false));
    }
    ctx.globalCompositeOperation = 'source-over';
    for (let i = hearts.length - 1; i >= 0; i--) {
      const h = hearts[i];
      h.x += h.vx; h.y += h.vy; h.vy += .04; h.life -= .008;
      ctx.fillStyle = `rgba(${h.c},${Math.max(h.life, 0)})`;
      heartPath(h.x, h.y, h.s);
      if (h.life <= 0) hearts.splice(i, 1);
    }
    if (!reduce || hearts.length) requestAnimationFrame(frame);
  }
  if (reduce) { frame(); } else requestAnimationFrame(frame);

  function burst(cx, cy) {
    for (let i = 0; i < 70; i++) {
      const ang = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 6;
      hearts.push({ x: cx, y: cy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 3,
        s: 10 + Math.random() * 18, life: 1, c: hues[Math.random() * 3 | 0] });
    }
    if (reduce) requestAnimationFrame(frame);
  }

  /* ---------- the answers ---------- */
  const yes = document.getElementById('yes');
  const no = document.getElementById('no');
  const lines = ['不同意', '再想想？', '真的嗎…', '點不到吧', '別跑了啦', '你明明就想按左邊', '好啦好啦'];
  let tries = 0;

  const answers = document.querySelector('.answers');

  // 可見畫面的大小（手機網址列收合時也算得準）
  function view() {
    const vv = window.visualViewport;
    return { w: vv ? vv.width : document.documentElement.clientWidth,
             h: vv ? vv.height : document.documentElement.clientHeight };
  }

  // 把按鈕夾在畫面內，四邊至少留 16px
  function clampInView(x, y) {
    const { w, h } = view(), pad = 16;
    return {
      x: Math.min(Math.max(pad, x), Math.max(pad, w - no.offsetWidth - pad)),
      y: Math.min(Math.max(pad, y), Math.max(pad, h - no.offsetHeight - pad))
    };
  }

  function dodge() {
    tries++;
    const prev = no.getBoundingClientRect();
    if (!no.classList.contains('loose')) {
      // 搬到 body 底下，避免被有動畫的卡片影響定位
      no.style.left = prev.left + 'px';
      no.style.top = prev.top + 'px';
      no.classList.add('loose');
      document.body.appendChild(no);
    }
    no.textContent = lines[Math.min(tries, lines.length - 1)];
    yes.style.setProperty('--grow', Math.min(1 + tries * .12, 1.8).toFixed(2));

    const bw = no.offsetWidth, bh = no.offsetHeight;
    const y = yes.getBoundingClientRect();
    const { w, h } = view();
    let p, guard = 0;
    do {
      p = clampInView(Math.random() * (w - bw), Math.random() * (h - bh));
      guard++;
    } while (guard < 60 && (
      Math.hypot(p.x - prev.left, p.y - prev.top) < 100 ||
      (p.x < y.right + 16 && p.x + bw > y.left - 16 && p.y < y.bottom + 16 && p.y + bh > y.top - 16)
    ));
    no.style.left = p.x + 'px';
    no.style.top = p.y + 'px';
  }

  // 視窗大小改變時，把跑出去的按鈕拉回來
  function keepInside() {
    if (!no.classList.contains('loose')) return;
    const p = clampInView(parseFloat(no.style.left) || 0, parseFloat(no.style.top) || 0);
    no.style.left = p.x + 'px';
    no.style.top = p.y + 'px';
  }
  addEventListener('resize', keepInside);
  if (window.visualViewport) visualViewport.addEventListener('resize', keepInside);

  no.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') dodge(); });
  no.addEventListener('pointerdown', e => { e.preventDefault(); dodge(); });
  no.addEventListener('click', e => { e.preventDefault(); if (e.detail === 0) dodge(); });

  yes.addEventListener('click', () => {
    const r = yes.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2);
    document.getElementById('ask').hidden = true;
    no.hidden = true;
    document.getElementById('after').hidden = false;
    setTimeout(() => burst(innerWidth / 2, innerHeight / 2), 600);
  });

  // 點畫面任何地方都會再噴愛心
  document.getElementById('after').addEventListener('click', e => {
    if (e.target.id !== 'again') burst(e.clientX, e.clientY);
  });

  // 再來一次：回到最初的問題
  document.getElementById('again').addEventListener('click', () => {
    tries = 0;
    no.textContent = lines[0];
    no.classList.remove('loose');
    no.style.left = no.style.top = '';
    answers.appendChild(no);
    no.hidden = false;
    yes.style.removeProperty('--grow');
    document.getElementById('after').hidden = true;
    const ask = document.getElementById('ask');
    ask.hidden = false;
    ask.style.animation = 'none'; ask.offsetHeight; ask.style.animation = '';
  });
})();
</script>

<script>
/* ---------- 背景音樂：用 Web Audio 即時合成的音樂盒小曲，不需要音檔 ---------- */
(() => {
  const btn = document.getElementById('music');
  const label = btn.querySelector('.label');
  const BPM = 72, BEAT = 60 / BPM, BAR = BEAT * 4;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  // 八小節的和弦進行：Fmaj7 – Em7 – Am7 – Cmaj7/G – Dm7 – Em7 – Fmaj7 – G6
  const chords = [
    { bass: 41, tones: [53, 57, 60, 64] },
    { bass: 40, tones: [52, 55, 59, 62] },
    { bass: 45, tones: [57, 60, 64, 67] },
    { bass: 43, tones: [55, 60, 64, 71] },
    { bass: 38, tones: [50, 53, 57, 60] },
    { bass: 40, tones: [52, 55, 59, 62] },
    { bass: 41, tones: [53, 57, 60, 64] },
    { bass: 43, tones: [55, 59, 62, 64] }
  ];
  // 旋律：[音高, 拍數]，null 是休止
  const melody = [
    [[76, 2], [72, 1], [74, 1]],
    [[76, 1.5], [79, .5], [71, 2]],
    [[72, 1], [76, 1], [81, 2]],
    [[79, 3], [null, 1]],
    [[77, 1], [76, 1], [74, 1], [72, 1]],
    [[71, 1], [72, 1], [74, 2]],
    [[69, 1], [72, 1], [77, 1], [76, 1]],
    [[74, 3], [null, 1]]
  ];
  const arp = [0, 1, 2, 3, 1, 2, 3, 2];

  let ctx, master, dry, wet, timer, nextBar = 0, barIndex = 0, playing = false;

  function setup() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = 0;
    const tone = ctx.createBiquadFilter();
    tone.type = 'lowpass'; tone.frequency.value = 4200;
    master.connect(tone).connect(ctx.destination);

    // 用衰減雜訊做一個柔軟的殘響
    const len = ctx.sampleRate * 3.2;
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
    }
    const verb = ctx.createConvolver(); verb.buffer = ir;
    wet = ctx.createGain(); wet.gain.value = .5;
    dry = ctx.createGain(); dry.gain.value = .75;
    verb.connect(wet).connect(master);
    dry.connect(master);
    dry.send = verb;
  }

  function out(node) { node.connect(dry); node.connect(dry.send); }

  // 音樂盒的「叮」：基音 + 高八度泛音，快速起音、慢慢消失
  function chime(midi, t, vol, decay) {
    const f = mtof(midi);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + .006);
    g.gain.exponentialRampToValueAtTime(.0001, t + decay);
    [[1, 1], [2, .28], [4.02, .06]].forEach(([mult, amp]) => {
      const o = ctx.createOscillator();
      o.type = 'sine'; o.frequency.value = f * mult;
      const a = ctx.createGain(); a.gain.value = amp;
      o.connect(a).connect(g);
      o.start(t); o.stop(t + decay + .05);
    });
    out(g);
  }

  // 柔和的鋪底和弦
  function pad(tones, t, dur) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.022, t + 1.2);
    g.gain.setValueAtTime(.022, t + dur - .4);
    g.gain.linearRampToValueAtTime(0, t + dur + .8);
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 900;
    lp.connect(g);
    tones.forEach(m => [-6, 6].forEach(cents => {
      const o = ctx.createOscillator();
      o.type = 'triangle'; o.frequency.value = mtof(m); o.detune.value = cents;
      o.connect(lp); o.start(t); o.stop(t + dur + 1);
    }));
    out(g);
  }

  function bass(midi, t, dur) {
    const o = ctx.createOscillator();
    o.type = 'sine'; o.frequency.value = mtof(midi);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.09, t + .08);
    g.gain.exponentialRampToValueAtTime(.02, t + dur);
    g.gain.linearRampToValueAtTime(0, t + dur + .3);
    o.connect(g); o.start(t); o.stop(t + dur + .4);
    g.connect(dry);
  }

  function scheduleBar(i, t) {
    const c = chords[i];
    bass(c.bass, t, BAR);
    pad(c.tones, t, BAR);
    arp.forEach((k, n) => chime(c.tones[k] + 12, t + n * BEAT / 2, .045, 1.3));
    let beat = 0;
    melody[i].forEach(([m, len]) => {
      if (m !== null) chime(m, t + beat * BEAT, .11, Math.max(1.6, len * BEAT * 1.4));
      beat += len;
    });
  }

  function tick() {
    while (nextBar < ctx.currentTime + .5) {
      scheduleBar(barIndex, nextBar);
      nextBar += BAR;
      barIndex = (barIndex + 1) % chords.length;
    }
  }

  function render() {
    btn.classList.toggle('on', playing);
    btn.classList.toggle('off', !playing);
    btn.setAttribute('aria-pressed', playing);
    label.textContent = playing ? '音樂 開' : (ctx ? '音樂 關' : '開啟音樂');
  }

  function start() {
    if (playing) return;
    if (!ctx) setup();
    ctx.resume();
    playing = true;
    const now = ctx.currentTime;
    if (nextBar < now) nextBar = now + .1;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value, now);
    master.gain.linearRampToValueAtTime(.7, now + 2.5);
    tick();
    timer = setInterval(tick, 100);
    render();
  }

  function stop() {
    if (!playing) return;
    playing = false;
    const now = ctx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value, now);
    master.gain.linearRampToValueAtTime(0, now + .8);
    clearInterval(timer);
    setTimeout(() => { if (!playing) ctx.suspend(); }, 900);
    render();
  }

  btn.addEventListener('click', () => (playing ? stop() : start()));

  // 瀏覽器規定要先有一次點擊才能出聲：第一次點畫面任何地方就開始播放
  function firstTouch(e) {
    if (e.target.closest('#music')) return;
    removeEventListener('pointerdown', firstTouch, true);
    removeEventListener('keydown', firstTouch, true);
    if (!ctx) start();
  }
  addEventListener('pointerdown', firstTouch, true);
  addEventListener('keydown', firstTouch, true);

  // 按下「同意」時加一段往上爬的叮叮聲
  document.getElementById('yes').addEventListener('click', () => {
    if (!ctx) start();
    if (!playing) return;
    const t = ctx.currentTime + .05;
    [72, 76, 79, 84, 88, 91, 96].forEach((m, i) => chime(m, t + i * .09, .12, 2.4));
  });

  // 切到別的分頁時暫停，回來再接著播
  document.addEventListener('visibilitychange', () => {
    if (!ctx || !playing) return;
    if (document.hidden) { clearInterval(timer); ctx.suspend(); }
    else { ctx.resume(); nextBar = Math.max(nextBar, ctx.currentTime + .1); timer = setInterval(tick, 100); }
  });
})();
</script>
</body>
</html>
